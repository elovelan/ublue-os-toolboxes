name: Build Arch Toolbox
on:
  workflow_dispatch:
  push:
    branches:
      - custom_workflow

jobs:
  push-ghcr:
    name: Build image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      BUILDAH_LAYERS: true # use caching
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          # Generate a timestamp for creating an image version history
          TIMESTAMP="$(date +%Y%m%d)"
          BUILD_TAGS=()
          # Have tags for tracking builds during pull request
          SHA_SHORT="${GITHUB_SHA::7}"

          BUILD_TAGS=("${TIMESTAMP}")
          BUILD_TAGS+=("${SHA_SHORT}")
          BUILD_TAGS+=("latest")

          alias_tags=("${BUILD_TAGS[@]}")
          echo "Generated the following build tags: "
          for TAG in "${BUILD_TAGS[@]}"; do
              echo "${TAG}"
          done
          echo "alias_tags=${alias_tags[*]}" >> $GITHUB_OUTPUT

      - name: arch-toolbox Variables
        run: |
          echo "IMAGE_NAME=arch-toolbox" >> $GITHUB_ENV

      # Build metadata
      - name: arch-toolbox Image Metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        id: meta-arch-toolbox
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/ublue-os/boxkit/main/README.md

      # Build image using Buildah action
      - name: arch-toolbox Build Image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./toolboxes/arch-toolbox/Containerfile.arch
            ./toolboxes/arch-toolbox/Containerfile.archamdgpupro
          image: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ steps.generate-tags.outputs.alias_tags }}
          labels: ${{ steps.meta-arch-toolbox.outputs.labels }}
          oci: false
          extra-args: |
            --target=${{ env.IMAGE_NAME }} --security-opt=seccomp=unconfined

      - name: arch-toolbox-amdgpupro Variables
        run: |
          echo "IMAGE_NAME=arch-toolbox-amdgpupro" >> $GITHUB_ENV

      # Build metadata
      - name: arch-toolbox-amdgpupro Image Metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        id: meta-arch-toolbox-amdgpupro
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/ublue-os/boxkit/main/README.md

      # Build image using Buildah action
      - name: arch-toolbox-amdgpupro Build Image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          containerfiles: |
            ./toolboxes/arch-toolbox/Containerfile.arch
            ./toolboxes/arch-toolbox/Containerfile.archamdgpupro
          image: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ steps.generate-tags.outputs.alias_tags }}
          labels: ${{ steps.meta-arch-toolbox-amdgpupro.outputs.labels }}
          oci: false
          extra-args: |
            --target=${{ env.IMAGE_NAME }} --security-opt=seccomp=unconfined
